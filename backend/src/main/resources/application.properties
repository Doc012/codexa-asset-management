spring.application.name=auth

# App (Used in email links - change to the frontend URL in production)
app.base-url=http://localhost:8080


# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/asset_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Configuration
jwt.secret=dev-super-secret-key-minimum-32-characters-for-hs256-algo-dev
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sphashepherd@gmail.com
spring.mail.password=bejfdbsrmuztzkwt
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Async (for email sending)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
