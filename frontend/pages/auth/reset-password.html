<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <title>Reset Password – AssetIQ</title>
</head>
<body>

<section class="reset-password">
  <div class="container-sm">

    <!-- ✅ MATCHES LOGIN STRUCTURE -->
    <form class="card forgot-form" id="resetForm" novalidate>

      <div class="logo-wrapper">
        <img src="/assets/images/AssetIq-removebg-preview.png" alt="AssetIQ Logo">
      </div>

      <h2>Reset Password</h2>
      <p>Enter your new password below</p>

      <div id="invalidTokenBox" class="alert alert-error" hidden>
        This reset link is invalid or has expired.
        <a href="forgot-password.html">request a new one</a>.
      </div>

      <div id="errorBox"   class="alert alert-error"   hidden></div>
      <div id="successBox" class="alert alert-success" hidden></div>

      <!-- ✅ INPUT now inherits correct styling -->
      <input
        type="password"
        id="newPassword"
        name="newPassword"
        placeholder="New password (min. 8 characters)"
        autocomplete="new-password"
        required
      >

      <!-- ✅ BUTTON now matches login -->
      <button type="submit" id="submitBtn" class="btn">
        Reset Password
      </button>

      <p>
        <a href="login.html"><b>Back to Login</b></a>
      </p>

    </form>

  </div>
</section>

<script type="module" src="/assets/js/auth/resetPassword.js"></script>
</body>
</html>
