<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <title>Forgot Password – AssetIQ</title>
</head>
<body>

<section class="forgot-password">
  <div class="container-sm">
    <form class="card forgot-form" id="forgotForm" novalidate>

      <div class="logo-wrapper">
        <img src="/assets/images/AssetIq-removebg-preview.png" alt="AssetIQ Logo">
      </div>

      <h2>Forgot Password</h2>
      <p>Enter your email and we'll send you a reset link.</p>

      <div id="errorBox"   class="alert alert-error"   hidden></div>
      <div id="successBox" class="alert alert-success" hidden></div>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <button type="submit" id="submitBtn" class="btn">Send Reset Link</button>

      <p><a href="login.html"><b>Back to Login</b></a></p>

    </form>
  </div>
</section>

<script type="module" src="/assets/js/auth/forgotPassword.js"></script>
</body>
</html>
