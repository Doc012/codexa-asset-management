  <main id="mainContent" class="content manager-hub-content">
    <div class="executive-header">
      <div class="header-titles">
        <span class="system-tag">Management System</span>
        <h1 class="ledger-title">Audit Logs</h1>
      </div>
      <div class="clearance-tag">
        Clearance Level:
        <span class="clearance-level">Admin Account</span>
      </div>
    </div>

    <div class="portal-filter-bar">
      <div class="search-input-container">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
        </span>
        <input type="text" id="log-search-input" placeholder="Search by email, message, log ID…" />
      </div>

      <div class="filter-controls-group">
        <div class="filter-dropdown-wrapper">
          <label for="action-type-select">Action</label>
          <select id="action-type-select">
            <option value="ALL">All actions</option>
            <option value="CREATE">Create</option>
            <option value="UPDATE">Update</option>
            <option value="APPROVE">Approve</option>
            <option value="DELETE">Delete</option>
            <option value="CHECK_OUT">Check out</option>
            <option value="CHECK_IN">Check in</option>
            <option value="CANCEL">Cancel</option>
          </select>
        </div>

        <div class="filter-dropdown-wrapper">
          <label for="entity-type-select">Entity</label>
          <select id="entity-type-select">
            <option value="ALL">All entities</option>
            <option value="ASSET">Asset</option>
            <option value="LOAN">Loan</option>
            <option value="USER">User</option>
          </select>
        </div>
      </div>
    </div>

    <div class="work-queue-container">
      <div class="report-header-actions">
        <div class="queue-heading-group">
          <h3 class="queue-heading">System Activity Logs</h3>
          <span class="log-result-count" id="logResultCount"></span>
        </div>
        <button id="downloadReportBtn" class="primary-btn download-btn">
          Download CSV Report
        </button>
      </div>

      <div class="panel-table-container">
        <table class="asset-table manager-ledger-table">
          <thead>
            <tr>
              <th>Log ID</th>
              <th>Action</th>
              <th>Entity</th>
              <th>Message</th>
              <th>User</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody class="reports-table"></tbody>
        </table>

        <div class="logs-empty-state" id="logsEmptyState" style="display: none;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            aria-hidden="true">
            <ellipse cx="12" cy="5" rx="9" ry="3" />
            <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5" />
            <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3" />
          </svg>
          <p>No logs match your filters</p>
        </div>
      </div>
    </div>
  </main>
