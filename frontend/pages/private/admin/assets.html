  <main id="mainContent" class="content">
    <section id="assets-management-section" class="page active">

      <div class="portal-toolbar-header">
        <div class="title-meta">
          <h1>Asset Management</h1>
          <p>Manage your organization's physical inventories and tracking parameters.</p>
        </div>
        <div class="action-buttons-group">
          <button class="portal-btn primary" id="open-add-modal-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" class="btn-icon-left">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Asset
          </button>
        </div>
      </div>

      <div class="portal-filter-bar">
        <div class="search-input-container">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="search-icon">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="asset-search-input" placeholder="Search assets...">
        </div>
        <div class="select-filters-container">
          <div class="filter-dropdown-wrapper">
            <label>Category:</label>
            <select id="filter-category-select">
              <option value="all">All Categories</option>
              <option value="Laptop">Laptop</option>
              <option value="Desktop">Desktop</option>
              <option value="Monitor">Monitor</option>
              <option value="Printer">Printer</option>
              <option value="Projector">Projector</option>
              <option value="Tablet">Tablet</option>
              <option value="Mobile Phone">Mobile Phone</option>
              <option value="Network Device">Network Device</option>
              <option value="Server">Server</option>
              <option value="Accessory">Accessory</option>
              <option value="Furniture">Furniture</option>
              <option value="Software License">Software License</option>
              <option value="Vehicle">Vehicle</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="select-filters-container">
          <div class="filter-dropdown-wrapper" id="categoryFilter">
            <label>Conditions:</label>
            <select id="conditionFilter">
              <option value="">All Conditions</option>
              <option value="DAMAGED">Damaged</option>
              <option value="FAIR">Fair</option>
              <option value="GOOD">Good</option>
              <option value="NEW">New</option>
              <option value="RETIRED">Retired</option>
            </select>
          </div>
        </div>
      </div>

      <!-- MAIN CRUD DATA LEDGER -->
      <div class="portal-card-table-wrapper">
        <table id="assets-crud-table" class="asset-table manager-ledger-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Image</th>
              <th>Category</th>
              <th>Status</th>
              <th>Condition</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="assets-table-body">

          </tbody>
        </table>
      </div>
    </section>

    <!-- MODAL OVERLAY BOX -->
    <div id="asset-modal-overlay" class="modal-hidden">
      <div class="portal-modal-card">
        <div class="modal-card-header">
          <h2 id="modal-form-title">Add System Asset</h2>
          <button id="close-modal-btn" class="modal-close-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <form id="asset-crud-form">
          <input type="hidden" id="form-asset-id" value="" />

          <div class="form-row split">
            <div class="form-field">
              <label>Asset Title *</label>
              <input type="text" id="form-title" required placeholder="e.g. Dell XPS Laptop" />
            </div>
            <div class="form-field">
              <label>Category *</label>
              <select id="form-category" required>
                <option value="LAPTOP">Laptop</option>
              <option value="DESKTOP">Desktop</option>
              <option value="MONITOR">Monitor</option>
              <option value="PRINTER">Printer</option>
              <option value="PROJECTOR">Projector</option>
              <option value="TABLET">Tablet</option>
              <option value="MOBILE_PHONE">Mobile Phone</option>
              <option value="NETWORK_DEVICE">Network Device</option>
              <option value="SERVER">Server</option>
              <option value="ACCESSORY">Accessory</option>
              <option value="FURNITURE">Furniture</option>
              <option value="SOFTWARE_LICENSE">Software License</option>
              <option value="VEHICLE">Vehicle</option>
              <option value="OTHER">Other</option>
              </select>
            </div>
          </div>

          <div class="form-row split">
            <div class="form-field">
              <label>Serial Number *</label>
              <input type="text" id="form-serial" required placeholder="DEL-XPS-123" />
            </div>
            <div class="form-field">
              <label>Acquisition Date *</label>
              <input type="date" id="form-date" required />
            </div>
          </div>

          <div class="form-row split">
            <div class="form-field">
              <label>Asset Cost *</label>
              <input type="number" id="form-cost" step="0.01" required placeholder="0.00" />
            </div>
            <div class="form-field">
              <label>Condition Status *</label>
              <select id="form-condition" required>
                <option value="NEW">New</option>
                <option value="RETIRED">Retired</option>
                <option value="GOOD">Good</option>
                <option value="FAIR">Fair</option>
                <option value="DAMAGED">Damaged</option>
              </select>
            </div>
          </div>

          <div class="form-field">
            <label>Deployment Location *</label>
            <input type="text" id="form-location" required placeholder="Office Building A, Floor 3" />
          </div>

          <div class="form-field">
            <label>Asset Image</label>
            <input type="file" id="form-photo" accept="image/*" />
          </div>

          <div class="form-actions">
            <button type="button" id="cancel-form-btn" class="portal-btn secondary">Edit asset</button>
            <button type="button" class="portal-btn primary">Retire</button>
          </div>
        </form>
      </div>
    </div>

    <div id="btnConfirmation" class="modal">
      <div class="modal-content">
        <h2>Are you sure?</h2>
        <p>You won't be able to go back once you confirm.</p>
        <div class="modal-actions">
          <button id="confirmBtn" class="confirm">Yes, Confirm</button>
          <button id="cancelBtn" class="cancel">Cancel</button>
        </div>
      </div>
    </div>
    <div id="successMessage" class="success"></div>

    <div id="assetDetailsModal" class="modal-more">
      <div class="modal-content asset-modal-content">
        <span id="closeAssetModal" style="float: right; cursor: pointer; font-size: 20px">
          &times;
        </span>

        <div id="assetDetailsBody"></div>
      </div>
    </div>
  </main>
