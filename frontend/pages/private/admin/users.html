  <main id="mainContent" class="content">
    <section id="usersPage" class="page active">
      <div class="portal-toolbar-header">
        <div class="title-meta">
          <h1>User Management</h1>
          <p>
            Add, update, or remove users and configure permissions to secure the business assets.
          </p>
        </div>

        <button id="open-add-user-modal" class="primary-btn">
          + Create User
        </button>

      </div>

      <div class="portal-filter-bar">
        <div class="search-input-container">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="userSearchInput"
            placeholder="Search by name, professional identity context, or email..." />
        </div>
        <div class="filter-dropdown-wrapper">
          <label for="userRoleFilter">Role</label>
          <select id="userRoleFilter">
            <option value="all">All Roles</option>
            <option value="ADMIN">Administrator</option>
            <option value="STAFF">Standard User</option>
            <option value="MANAGER">Manager</option>
            <!-- <option value="pending">Elevation Requests</option> -->
          </select>
        </div>
      </div>

      <div class="portal-card-table-wrapper">
        <table class="asset-table">
          <thead>
            <tr>
              <th>User Information</th>
              <th>System Position</th>
              <th>Current Assignment Footprint</th>
              <th>Status Profile</th>
              <th class="actions-header">Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
          </tbody>
        </table>

        <!-- USER EDIT MODAL -->
        <div id="user-modal-overlay" class="modal-hidden">
          <div class="portal-modal-card">
            <div class="modal-card-header">
              <h2 id="user-modal-title">Edit User</h2>
              <button id="close-user-modal">✕</button>
            </div>

            <form id="user-edit-form">
              <!-- hidden ID -->
              <input type="hidden" id="user-id" />

              <div class="form-field">
                <label>First Name</label>
                <input type="text" id="edit-firstName" required />
              </div>

              <div class="form-field">
                <label>Last Name</label>
                <input type="text" id="edit-lastName" required />
              </div>

              <div class="form-field">
                <label>Email</label>
                <input type="email" id="edit-email" required />
              </div>

              <div class="form-field">
                <label>Department</label>
                <input type="text" id="edit-department" required />
              </div>

              <div class="form-field">
                <label>Role</label>
                <select id="edit-role">
                  <option value="ADMIN">ADMIN</option>
                  <option value="STAFF">STAFF</option>
                  <option value="MANAGER">MANAGER</option>
                </select>
              </div>

              <div class="form-field">
                <label>Status</label>
                <select id="edit-status">
                  <option value="PENDING_VERIFICATION">Pending Verification</option>
                  <option value="ACTIVE">Active</option>
                  <option value="INACTIVE">Inactive</option>
                  <option value="PENDING_APPROVAL">Pending Approval</option>
                </select>
              </div>

              <div class="form-actions">
                <button type="button" id="cancel-user-edit">Cancel</button>
                <button type="submit">Save Changes</button>
              </div>
            </form>
          </div>
        </div>

        <div id="add-user-modal-overlay" class="modal-hidden">
          <div class="portal-modal-card">
            <div class="modal-card-header">
              <h2>Add New User</h2>
              <button id="close-add-user-modal">✕</button>
            </div>

            <form id="add-user-form">
              <div class="form-row split">
                <div class="form-field">
                  <label>First Name *</label>
                  <input type="text" id="add-firstName" required />
                </div>

                <div class="form-field">
                  <label>Last Name *</label>
                  <input type="text" id="add-lastName" required />
                </div>
              </div>

              <div class="form-field">
                <label>Email *</label>
                <input type="email" id="add-email" required />
              </div>

              <div class="form-field">
                <label>Department *</label>
                <input type="text" id="add-department" required />
              </div>

              <div class="form-field">
                <label>Password *</label>
                <input type="password" id="add-password" required />
              </div>

              <div class="form-actions">
                <button type="button" id="cancel-add-user">Cancel</button>
                <button type="submit">Create User</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
