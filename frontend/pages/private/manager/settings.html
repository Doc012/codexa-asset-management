  <main id="mainContent" class="content manager-hub-content">
    <div class="executive-header">
      <div class="header-titles">
        <span class="system-tag">Management System</span>
        <h1 class="ledger-title">Account Profiles &amp; Settings</h1>
      </div>
      <div class="clearance-tag">
        Clearance Level: <span class="clearance-level">Manager Account</span>
      </div>
    </div>

    <section id="dashboardPage" class="page active" style="padding: 0; background: transparent; box-shadow: none;">
      <div class="settings-card" style="margin-top: 0;">
        <h2>Account Settings</h2>

        <div class="settings-tabs">
          <button class="settings-tab-btn active" onclick="switchSettingsTab(event, 'profileFormPanel')">Settings
            Details</button>
          <button class="settings-tab-btn" onclick="switchSettingsTab(event, 'securityFormPanel')">Security</button>
        </div>

        <div id="profileFormPanel" class="settings-panel active-panel">
          <form onsubmit="handleSettingsSave(event, 'Profile updated successfully!')" id="profile-form">
            <div class="settings-grid">
              <div class="settings-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName"required>
              </div>
              <div class="settings-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
              </div>
              <div class="settings-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="locked-field"
                  readonly>
              </div>
              <div class="settings-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" class="locked-field"
                  readonly>
              </div>
            </div>
            <button type="submit" class="settings-save-btn">Save Profile</button>
            <div id="form-status-message"></div>
          </form>
        </div>

        <div id="securityFormPanel" class="settings-panel">
          <form onsubmit="handleSettingsSave(event, 'Password changed securely.')">
            <div class="settings-group single-column">
              <label for="sec-current">Current Password</label>
              <input type="password" id="sec-current" placeholder="••••••••••••" required>
            </div>
            <div class="settings-group single-column">
              <label for="sec-new">New Password</label>
              <input type="password" id="sec-new" placeholder="Minimum 8 characters" required>
            </div>
            <div class="settings-group single-column">
              <label for="sec-confirm">Confirm Password</label>
              <input type="password" id="sec-confirm" placeholder="Re-type new password" required>
            </div>
            <button type="submit" class="settings-save-btn">Update Password</button>
          </form>
        </div>
    </section>
  </main>

  <script type="module" src="../../../assets/js/guards/manager.guard.js"></script>
  <script type="module" src="../../../assets/js/common/header.js"></script>
  <script src="../../../assets/js/manager/users.js" type="module"></script>
  <script src="../../../assets/js/config.js" type="module"></script>
  <script src="../../../assets/js/user/script.js"></script>
</body>

</html>
