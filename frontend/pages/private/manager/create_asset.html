<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Asset</title>
</head>
<body>
    
    <h2>Create new asset:</h2>

    <form action="" id="create-asset-form">
        
        <input type="text" name="title" placeholder="Title" required>
        <input type="text" name="category" placeholder="Category" required>
        <input type="text" name="serialNumber" placeholder="Serial Number" required>
        <input type="date" name="acquisitionDate" required>
        <input type="number" name="cost" placeholder="Cost" required>
        <input type="text" name="location" placeholder="Location" required>
        <input type="text" name="condition" placeholder="Condition" required>
        <input type="text" name="photoPath" placeholder="Photo URL">

        <button type="submit">Create Asset</button>
    </form>

    <script type="module" src="../../../assets/js/assets.js"></script>
</body>
</html>
