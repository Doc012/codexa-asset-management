<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Asset</title>
</head>
<body>
    
    <h2>Create new asset:</h2>

    <form action="" id="create-asset-form">
        <input type="text" id="title" placeholder="Title" required>
        <input type="text" id="category" placeholder="Category" required>
        <input type="text" id="serialNumber" placeholder="Serial Number" required>
        <input type="date" id="acquisitionDate" required>
        <input type="number" id="cost" placeholder="Cost" required>
        <input type="text" id="location" placeholder="Location" required>
        <input type="text" id="condition" placeholder="Condition" required>
        <input type="text" id="photoPath" placeholder="Photo URL">

        <button type="submit">Create Asset</button>
    </form>

    <p id="message"></p>

    <script type="module" src="../../../assets/js/createAsset.js"></script>
</body>
</html>
