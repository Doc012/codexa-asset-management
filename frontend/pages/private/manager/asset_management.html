<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Asset Management System</h1>

    <!-- ✅ SECTION 1: VIEW ALL -->
    <section>
      <section class="card table_card">
            <div class="assets_table-container">
                <table class="assets_table">
                    <thead>
                        <tr>
                            <th>Asset ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Serial Number</th>
                            <th>Acquisition Date</th>
                            <th>Cost</th>
                            <th>Location</th>
                            <th>Condition</th>
                            <th>Photo Path</th>
                        </tr>
                    </thead>

                    <tbody id="asset-table-body">
                        
                    </tbody>
                </table>
            </div>
        </section>

    <!-- ✅ SECTION 2: CREATE / UPDATE -->
    <section>
      <h2>Create / Update Asset</h2>

      <form action="" id="create-asset-form">
        <input type="text" id="title" placeholder="Title" required>
        <input type="text" id="category" placeholder="Category" required>
        <input type="text" id="serialNumber" placeholder="Serial Number" required>
        <input type="date" id="acquisitionDate" required>
        <input type="number" id="cost" placeholder="Cost" required>
        <input type="text" id="location" placeholder="Location" required>
        <input type="text" id="condition" placeholder="Condition" required>
        <input type="text" id="photoPath" placeholder="Photo URL">

        <button type="submit">Create Asset</button>
    </form>

    <p id="message"></p>
    </section>

    <script type="module" src="../../../assets/js/assets.js"></script>
    <script type="module" src="../../../assets/js/createAsset.js"></script>
    
  </body>
</html>
