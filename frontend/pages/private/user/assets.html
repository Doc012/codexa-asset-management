<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Page</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../../assets/css/user/styles.css" />
    <link rel="stylesheet" href="../../../assets/css/user/dashboard.css" />
    <link rel="stylesheet" href="../../../assets/css/managerDashboard.css" />
    <link rel="stylesheet" href="../../../assets/css/user/assets.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="left-nav">
        <button id="menuBtn" class="menu-btn">☰</button>
        <h2 class="logo">Asset<span class="logo-accent"> IQ</span></h2>
      </div>

      <div class="right-nav">
        <div id="profile-container" class="profile-container">
          <div id="profileInitial" class="profile-initial">S</div>
          <img
            id="profileImage"
            class="profile-image"
            src=""
            alt="profile_picture"
          />

          <input type="file" id="profileUpload" hidden />

          <div class="profile-dropdown">
            <button id="uploadBtn">Upload Photo</button>
            <a href="./settings.html"><button>Profile</button></a>
            <button id="logoutBtn">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <aside id="sidebar" class="sidebar">
      <ul>
        <li class="nav-item">
          <a href="./dashboard.html" class="nav-link">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="nav-icon"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span class="nav-text">Dashboard</span>
          </a>
        </li>

        <li class="nav-item active">
          <a href="./assets.html" class="nav-link">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="nav-icon"
            >
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <span class="nav-text">Assets</span>
          </a>
        </li>

        <li class="nav-item">
          <a href="./loans.html" class="nav-link">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="nav-icon"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
            <span class="nav-text">Loans</span>
          </a>
        </li>

        <hr style="border: none; border-top: 1px solid #343b48; margin: 15px 10px" />

        <li class="nav-item">
          <a href="./settings.html" class="nav-link">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="nav-icon"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              ></path>
            </svg>
            <span class="nav-text">Settings</span>
          </a>
        </li>
      </ul>
    </aside>

    <main id="mainContent" class="content manager-hub-content">
      <div class="executive-header">
        <div class="header-titles">
          <span class="system-tag">Employee Portal</span>
          <h1 class="ledger-title">Corporate Asset Registry</h1>
        </div>

        <div class="clearance-tag">
          Clearance Level:
          <span class="clearance-level">Staff Account</span>
        </div>
      </div>

      <div class="portal-filter-bar">
        <div class="search-input-container">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="search-icon"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="assetSearch" placeholder="Search assets..." />
        </div>

        <div class="filters-group">
          <div class="filter-dropdown-wrapper">
            <label>Category:</label>
            <select id="filter-category-select">
              <option value="ALL">All Categories</option>
              <option value="LAPTOP">Laptop</option>
              <option value="DESKTOP">Desktop</option>
              <option value="MONITOR">Monitor</option>
              <option value="PRINTER">Printer</option>
              <option value="PROJECTOR">Projector</option>
              <option value="TABLET">Tablet</option>
              <option value="MOBILE_PHONE">Mobile Phone</option>
              <option value="NETWORK_DEVICE">Network Device</option>
              <option value="SERVER">Server</option>
              <option value="ACCESSORY">Accessory</option>
              <option value="FURNITURE">Furniture</option>
              <option value="SOFTWARE_LICENSE">Software License</option>
              <option value="VEHICLE">Vehicle</option>
              <option value="OTHER">Other</option>
            </select>
          </div>

          <div class="filter-dropdown-wrapper">
            <label>Conditions:</label>
            <select id="conditionFilter">
              <option value="">All Conditions</option>
              <option value="DAMAGED">Damaged</option>
              <option value="FAIR">Fair</option>
              <option value="GOOD">Good</option>
              <option value="NEW">New</option>
              <option value="RETIRED">Retired</option>
            </select>
          </div>
        </div>
      </div>

      <div class="work-queue-container">
        <h3 class="queue-heading">Asset Master Inventory</h3>

        <div class="panel-table-container">
          <table class="asset-table manager-ledger-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Photo</th>
                <th>Category</th>
                <th>Status</th>
                <th>Condition</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="assetsTableBody"></tbody>
          </table>
        </div>
      </div>

      <div id="btnConfirmation" class="modal">
        <div class="modal-content">
          <h2>Are you sure?</h2>
          <p>You won't be able to go back once you confirm.</p>

          <div class="modal-actions">
            <button id="confirmBtn" class="confirm">Yes, Confirm</button>
            <button id="cancelBtn" class="cancel">Cancel</button>
          </div>
        </div>
      </div>
    </main>

    <script src="../../../assets/js/config.js" type="module"></script>
    <script src="../../../assets/js/user/script.js"></script>
    <script type="module" src="../../../assets/js/common/header.js"></script>
    <script src="../../../assets/js/user/loans.js" type="module"></script>
    <script src="../../../assets/js/user/users.js" type="module"></script>
    <script src="../../../assets/js/user/assets.js" type="module"></script>
  </body>
</html>
