<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset IQ - Enterprise Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/user/styles.css">
  <link rel="stylesheet" href="../../../assets/css/user/dashboard.css">
  <link rel="stylesheet" href="../../../assets/css/admin/dashboard.css">
</head>

<body>
  <header class="topbar">
    <div class="left-nav">
      <button id="menuBtn" class="menu-btn">☰</button>
      <h2 class="logo">Asset<span class="logo-accent"> IQ</span><span class="company-name">_powered by Codexa</span>
      </h2>
    </div>
    <div class="right-nav">
      <div id="profile-container" class="profile-container">
        <div id="profileInitial" class="profile-initial"></div>
        <img id="profileImage" class="profile-image">
        <input type="file" id="profileUpload" hidden>
        <div class="profile-dropdown">
          <button id="uploadBtn">Upload Photo</button>
          <a href="./settings.html"><button>Profile</button></a>
          <button id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <aside id="sidebar" class="sidebar">
    <ul>
      <li class="nav-item active">
        <a href="./dashboard.html" class="nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="nav-text">Dashboard</span>
        </a>
      </li>

      <li class="nav-item">
        <a href="./assets.html" class="nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span class="nav-text">Assets</span>
        </a>
      </li>

      <li class="nav-item">
        <a href="./loans.html" class="nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <span class="nav-text">Loans</span>
        </a>
      </li>

      <hr style="border: none; border-top: 1px solid #343B48; margin: 15px 10px;">

      <li class="nav-item">
        <a href="./settings.html" class="nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
          <span class="nav-text">Settings</span>
        </a>
      </li>
    </ul>
  </aside>

  <main id="mainContent" class="content">
    <section id="dashboardPage" class="page active">

      <div class="portal-toolbar-header">
        <div class="title-meta">
          <h1>User Dashboard</h1>
          <p>Manage your assigned assets, active loans and upcoming returns from one place.</p>
        </div>
      </div>

      <div class="stats-grid">

        <div class="stat-card">
          <div class="metric-icon-frame primary-tint">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>

          <div class="metric-data">
            <small>Total Assets</small>
            <h2 id="totalAssets">0</h2>
          </div>
        </div>

        <div class="stat-card">
          <div class="metric-icon-frame success-tint">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          </div>

          <div class="metric-data">
            <small>My Loans</small>
            <h2 id="totalLoans">0</h2>
          </div>
        </div>

        <div class="stat-card" id="due">
          <div class="metric-icon-frame warning-tint">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>

          <div class="metric-data">
            <small>Due Soon</small>
            <h2 id="total_requests">0</h2>
          </div>
        </div>

        <div class="stat-card danger">
          <div class="metric-icon-frame danger-tint">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>

          <div class="metric-data">
            <small>Overdue</small>
            <h2 id="overdue" class="danger-text">0</h2>
          </div>
        </div>

      </div>


      <div class="portal-card-table-wrapper">

        <div class="card-inline-header">
          <h4>Assets</h4>

          <a href="assets.html" class="action-view-all-link">
            View All
          </a>
        </div>

        <table class="asset-table">

          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Condition</th>
              <th>Picture</th>
            </tr>
          </thead>

          <tbody id="user-asset-table-body">

          </tbody>

        </table>
      </div>

      <div id="successMessage" class="success"></div>

    </section>
  </main>

  <script type="module" src="../../../assets/js/guards/staff.guard.js"></script>
  <script type="module" src="../../../assets/js/common/header.js"></script>
  <script src="../../../assets/js/user/users.js" type="module"></script>
  <script src="../../../assets/js/user/assets.js" type="module"></script>
  <script src="../../../assets/js/user/loans.js" type="module"></script>
  <script src="../../../assets/js/user/script.js" type="module"></script>

</body>

</html>
