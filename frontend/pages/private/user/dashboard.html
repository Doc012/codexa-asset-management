<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset IQ - Enterprise Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/user/styles.css">
  <link rel="stylesheet" href="../../../assets/css/user/dashboard.css">
</head>

<body>
  <header class="topbar">

    <div class="left-nav">
      <button id="menuBtn" class="menu-btn">☰</button>
      <h2 class="logo">Asset IQ</h2>
    </div>
    <div class="right-nav">
      <div id="profileContainer" class="profile-container">
        <div id="profileInitial" class="profile-initial">S</div>
        <img id="profileImage" class="profile-image" src="" alt="profile_picture">
        <input type="file" id="profileUpload" hidden>
        <div class="profile-dropdown">
          <button id="uploadBtn">Upload Photo</button>
          <a href="./settings.html"><button>Profile</button></a>
          <button>Logout</button>
        </div>
      </div>
    </div>
  </header>

  <aside id="sidebar" class="sidebar">
  <ul>
    <li class="nav-item">
      <a href="./dashboard.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="nav-text">Dashboard</span>
      </a>
    </li>

    <li class="nav-item">
      <a href="./assets.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span class="nav-text">Assets</span>
      </a>
    </li>

    <li class="nav-item">
      <a href="./loans.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <span class="nav-text">Loans</span>
      </a>
    </li>

    <hr style="border: none; border-top: 1px solid #343B48; margin: 15px 10px;">

    <li class="nav-item">
      <a href="./settings.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="nav-text">Settings</span>
      </a>
    </li>
  </ul>
</aside>

  <main id="mainContent" class="content">
    <section id="dashboardPage" class="page active">

      <div class="welcome-card">
        <h1>Welcome Back, User</h1>
        <p>Manage assets, requests and loans from one place.</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>Assets</h3>
          <h2 id="totalAssets">0</h2>
        </div>

        <div class="stat-card">
          <h3>Loans</h3>
          <h2 id="totalLoans">0</h2>
        </div>

        <div class="stat-card" id="due">
          <h3>Due soon</h3>
          <h2 id="total_requests">0</h2>
        </div>

        <div class="stat-card danger">
          <h3>Overdue</h3>
          <h2 id="overdue">0</h2>
        </div>
      </div>

      <div class="panel">
        <h2>Recent Activity</h2>
        <ul class="activity-list" id="user_log">
        </ul>
        <a href="#"><button>view all</button></a>
      </div>

      <div class="assets">
        <h2>Assets</h2>
        <table border="1">
          <thead>
            <tr>
              <th>
                Title
              </th>
              <th>
                Category
              </th>
              <th>
                Condition
              </th>
              <th>
                Picture
              </th>
            </tr>
          </thead>
          <tbody id="user-asset-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>


  <script src="../../../assets/js/users.js" type="module"></script>
  <script src="../../../assets/js/user/assets.js" type="module"></script>
  <script src="../../../assets/js/auditLogs.js" type="module"></script>
  <script src="../../../assets/js/loans.js" type="module"></script>
  <script src="../../../assets/js/user/script.js" type="module"></script>
  
</body>

</html>
