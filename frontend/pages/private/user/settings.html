<body>

    <div class="left-nav">

      <h2 class="logo">Asset<span class="logo-accent"> IQ</span></h2>
    </div>
    <div class="right-nav">
      <div id="profileContainer" class="profile-container">
        <div id="profileInitial" class="profile-initial">S</div>
        <img id="profileImage" class="profile-image" src="" alt="profile_picture">
        <input type="file" id="profileUpload" hidden>
        <div class="profile-dropdown">
          <button id="uploadBtn">Upload Photo</button>
          <a href="./settings.html"><button>Profile</button></a>
          <button>Logout</button>
        </div>
      </div>
    </div>
  </header>

  <aside id="sidebar" class="sidebar">
  <ul>
    <li class="nav-item">
      <a href="./dashboard.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon">

          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="nav-text">Dashboard</span>
      </a>
    </li>

    <li class="nav-item">
      <a href="./assets.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span class="nav-text">Assets</span>
      </a>
    </li>

    <li class="nav-item">
      <a href="./loans.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <span class="nav-text">Loans</span>
      </a>
    </li>

    <hr style="border: none; border-top: 1px solid #343B48; margin: 15px 10px;">

    <li class="nav-item active">
      <a href="./settings.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="nav-text">Settings</span>
      </a>
    </li>
  </ul>
</aside>

  <main id="mainContent" class="content">
    <section id="dashboardPage" class="page active">
      <div class="settings-card">
        <h2>Account Settings</h2>

        <div class="settings-tabs">
          <button class="settings-tab-btn active" onclick="switchSettingsTab(event, 'profileFormPanel')">Profile Details</button>
          <button class="settings-tab-btn" onclick="switchSettingsTab(event, 'securityFormPanel')">Security</button>
          <button class="settings-tab-btn" onclick="switchSettingsTab(event, 'preferencesFormPanel')">Preferences</button>
        </div>

        <div id="profileFormPanel" class="settings-panel active-panel">
          <form onsubmit="handleSettingsSave(event, 'Profile updated successfully!')" id="profile-form">
            <div class="settings-grid">
              <div class="settings-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" value="John" required>
              </div>
              <div class="settings-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" value="Smith" required>
              </div>
              <div class="settings-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="john.smith@company.com" required>
              </div>
              <div class="settings-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" value="IT Department" class="locked-field" readonly>
              </div>
            </div>
            <button type="submit" class="settings-save-btn">Save Profile</button>
            <div id="form-status-message"></div>
          </form>
        </div>

        <div id="securityFormPanel" class="settings-panel">
          <form onsubmit="handleSettingsSave(event, 'Password changed securely.')">
            <div class="settings-group single-column">
              <label for="sec-current">Current Password</label>
              <input type="password" id="sec-current" placeholder="••••••••••••" required>
            </div>
            <div class="settings-group single-column">
              <label for="sec-new">New Password</label>
              <input type="password" id="sec-new" placeholder="Minimum 8 characters" required>
            </div>
            <div class="settings-group single-column">
              <label for="sec-confirm">Confirm Password</label>
              <input type="password" id="sec-confirm" placeholder="Re-type new password" required>
            </div>
            <button type="submit" class="settings-save-btn">Update Password</button>
          </form>
        </div>

        <div id="preferencesFormPanel" class="settings-panel">
          <form onsubmit="handleSettingsSave(event, 'System preferences updated.')">
            <div class="settings-group single-column inline-check">
              <label class="settings-checkbox">
                <input type="checkbox" checked>
                <span>Email me before a loan item is overdue?</span>
              </label>
            </div>
            <div class="settings-group single-column inline-check">
              <label class="settings-checkbox">
                <input type="checkbox" checked>
                <span>Notify me when requested assets are approved?</span>
              </label>
            </div>
            <div class="settings-group single-column">
              <label for="pref-layout">Default Inventory View</label>
              <select id="pref-layout">
                <option value="grid">Standard Dynamic Table</option>
                <option value="compact">High Density List</option>
              </select>
            </div>
            <button type="submit" class="settings-save-btn">Save Preferences</button>
          </form>
        </div>

      </div>

      <div id="settingsToast" class="settings-toast"></div>
    </section>
  </main>
  <script src="../../../assets/js/user/script.js"></script>
  <script src="../../../assets/js/user/users.js" type="module"></script>
</body>

</html>
