<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/forms.css">

    <title>Login</title>

</head>

<body>
    

<section class="login">
    <div class="container-sm">
        <form class="card login-form" method="post">
            
            <div class="logo-wrapper">
                <img src="assets/images/AssetIq-removebg-preview.png" alt="AssetIQ Logo">
            </div>

            <h2>Welcome Back</h2>
            <p>Login to access AssetIQ</p>

            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="Email address" 
                required
            >

            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Password" 
                required
            >

            <button type="submit" class="btn">Login</button>

            <p class="forgot-password">
                <a href="forgot-password.html"><b>Forgot Password</b></a>
            </p>
            <p>
                Don't have an account yet? 
                <a href="register.html"><b>Register</b></a>
            </p>
        </form>
    </div>
</section>


</body>
</html>
